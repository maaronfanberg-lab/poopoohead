class GPU{

}

for(let k of Object.keys(S))$(k).addEventListener('input',e=>{S[k]=+e.target.value;$('o'+k).textContent=String(S[k]);try{if(renderer instanceof GPU&&(k==='detail'||k==='layers'))renderer.regen();request()}catch(e){$('error').classList.add('visible');$('errortext').textContent=e.message}});
$('b6').onclick=()=>swap(6);$('b2').onclick=()=>swap(2);$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ Pause':'▶ Play';$('status').textContent=playing?'● LIVE':'● PAUSED';request()};
$('evolve').onclick=()=>{seed+=17;yaw=(rand(52)-.5)*2.4;pitch=(rand(37)-.5)*1.0;S.fold=Math.round(rand(64)*90+5);S.layers=Math.round(rand(76)*65+25);sync();renderer?.regen?.();drawSky();request()};
function sync(){for(let k in S){$(k).value=S[k];$('o'+k).textContent=S[k]}}
$('reset').onclick=()=>{Object.assign(S,{detail:80,layers:70,fold:35,glow:78,speed:32});seed=9;yaw=-.31;pitch=.24;zoom=1;time=0;playing=true;sync();renderer?.regen?.();$('play').textContent='Ⅱ Pause';drawSky();request()};
$('fallback').onclick=()=>fallback('manual');
const touches=new Map();let oldPinch=0,pinchZoom=1;
[art,compat].forEach(surface=>{
 surface.addEventListener('pointerdown',e=>{e.preventDefault();surface.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){let a=[...touches.values()];oldPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=zoom}});
 surface.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;e.preventDefault();let prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size>=2){let a=[...touches.values()];if(oldPinch)zoom=clamp(pinchZoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/oldPinch,.45,2.5)}else{yaw+=(e.clientX-prev.x)*.008;pitch=clamp(pitch+(e.clientY-prev.y)*.008,-1.5,1.5)}request()});
 const touchup=e=>{touches.delete(e.pointerId);oldPinch=0};surface.addEventListener('pointerup',touchup);surface.addEventListener('pointercancel',touchup);
});
function frame(now){let dt=Math.min(.075,(now-(last||now))/1000);last=now;if(playing&&S.speed>0&&now-lastframe>65){time+=dt*(.25+S.speed*.018);request();lastframe=now}raf=requestAnimationFrame(frame)}
init();if(renderer)request();requestAnimationFrame(frame);if(window.ResizeObserver)new ResizeObserver(()=>{renderer?.resize();drawSky();request()}).observe(view);else window.addEventListener('resize',()=>{renderer?.resize();drawSky();request()});
})();
</script></body></html>
